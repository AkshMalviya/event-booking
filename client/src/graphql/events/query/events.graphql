query Events($query: EventQueryDto) {
  events(query: $query) {
    meta {
      total
      page
      limit
      hasNextPage
    }
    data {
      id
      userId
      title
      slug
      image
      description
      startDate
      endDate
      availableSeats
      price
      tags
      registeredCount
      createdAt
      updatedAt
    }
  }
}
